name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BETTER_AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      ALLOWED_USERS: login:ci-user
      GOOGLE_CREDENTIALS_JSON: "{}"
      GOOGLE_VERTEX_PROJECT_ID: ci-project
      GOOGLE_VERTEX_LOCATION: us-central1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare example CMS config
        run: |
          cp cms.config.example.json cms.config.json
          cp frontmatter.scheme.example.json frontmatter.scheme.json

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
